# Local Postgres for development: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym
      POSTGRES_DB: gymdesk
    ports:
      - "5432:5432"
    volumes:
      - gymdesk-data:/var/lib/postgresql/data
volumes:
  gymdesk-data:
